<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- old-school database cylinder with wrench, flat 90s style -->
  <rect x="12" y="12" width="104" height="104" rx="8" fill="#c0c0c0" stroke="#808080" stroke-width="2"/>
  <rect x="14" y="14" width="100" height="100" rx="7" fill="#d4d0c8" stroke="#ffffff" stroke-width="1"/>

  <!-- database cylinder body -->
  <ellipse cx="64" cy="38" rx="28" ry="10" fill="#000080" stroke="#000000" stroke-width="1"/>
  <rect x="36" y="38" width="56" height="44" fill="#000080"/>
  <ellipse cx="64" cy="82" rx="28" ry="10" fill="#0000a0" stroke="#000000" stroke-width="1"/>

  <!-- cylinder lines -->
  <line x1="36" y1="50" x2="92" y2="50" stroke="#4040c0" stroke-width="1"/>
  <line x1="36" y1="62" x2="92" y2="62" stroke="#4040c0" stroke-width="1"/>
  <line x1="36" y1="74" x2="92" y2="74" stroke="#4040c0" stroke-width="1"/>

  <!-- wrench handle -->
  <rect x="72" y="72" width="6" height="28" rx="2" fill="#808080" stroke="#404040" stroke-width="1" transform="rotate(-30 75 86)"/>

  <!-- wrench head -->
  <path d="M82,68 L92,62 L96,66 L86,72 Z" fill="#808080" stroke="#404040" stroke-width="1"/>
  <circle cx="90" cy="64" r="4" fill="#d4d0c8" stroke="#404040" stroke-width="1"/>

  <!-- highlight on cylinder -->
  <ellipse cx="56" cy="38" rx="16" ry="5" fill="#4040c0" opacity="0.3"/>

  <!-- border shadow -->
  <rect x="12" y="12" width="104" height="104" rx="8" fill="none" stroke="#404040" stroke-width="1"/>
</svg>

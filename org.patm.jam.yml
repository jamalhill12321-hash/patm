app-id: org.patm.jam
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: patm

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.freedesktop.secrets

modules:
  - name: libpq
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DWITH_READLINE=OFF
      - -DWITH_ZLIB=ON
      - -DWITHOUT_ZLIB=OFF
    sources:
      - type: archive
        url: https://ftp.postgresql.org/pub/source/v17.2/postgresql-17.2.tar.bz2
        sha256: 16466279f026e527ea7d072a1aeac6aee2af5028f3a8c05c2d4c67b1c1d7d7d6

  - name: mariadb-connector-c
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DWITH_SSL=ON
      - -DWITH_AUTH=ON
      - -DWITH_UNIT_TESTS=OFF
    sources:
      - type: archive
        url: https://github.com/mariadb-corporation/mariadb-connector-c/archive/refs/tags/v3.4.1.tar.gz
        sha256: 5c0d0b4a7cdd5c5ef2f2e0c9ec7e5e3b3a4b80c8b8a0bf602e0c0a0e60d6e37a

  - name: patm
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
    sources:
      - type: git
        url: https://github.com/jamalhill12321-hash/patm.git
        tag: v0.0.0-experimental-patch-11
